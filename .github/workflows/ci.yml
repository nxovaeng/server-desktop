name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Frontend Typecheck & Go Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Check gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "以下 Go 文件未通过 gofmt 格式化检查:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Frontend build (vue-tsc + vite)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Go vet & tests
        run: |
          go vet -tags webkit2_41 ./...
          go test -tags webkit2_41 -race -count=1 ./...

  wails-build-check:
    name: Wails Desktop Build Check (linux-amd64)
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Linux desktop dependencies & Wails CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend packages
        working-directory: frontend
        run: npm ci

      - name: Build desktop package
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh --skip-test --version "ci-${GITHUB_SHA::7}" --out dist --package
