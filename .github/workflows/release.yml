name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g., v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  test:
    name: Verify Frontend & Go Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Frontend build & Go test
        run: |
          cd frontend && npm ci && npm run build && cd ..
          go vet -tags webkit2_41 ./...
          go test -tags webkit2_41 -count=1 ./...

  build-linux:
    name: Build linux-amd64
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF_NAME}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Install dependencies & Wails CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build & Package
        run: |
          cd frontend && npm ci && cd ..
          chmod +x scripts/build.sh
          ./scripts/build.sh --skip-test --version "${{ steps.meta.outputs.version }}" --out dist --package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-amd64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  build-windows:
    name: Build windows-amd64
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF_NAME}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Install Wails CLI & Frontend deps
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          cd frontend
          npm ci
          cd ..

      - name: Build & Package
        shell: pwsh
        run: |
          $env:PATH = "$(go env GOPATH)\bin;$env:PATH"
          wails build -clean -trimpath -platform windows/amd64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ver = "${{ steps.meta.outputs.version }}"
          $pkg = "server-desktop-$ver-windows-amd64"
          New-Item -ItemType Directory -Force -Path "dist/$pkg" | Out-Null
          Copy-Item "build/bin/*.exe" "dist/$pkg/"
          if (Test-Path "README.md") { Copy-Item "README.md" "dist/$pkg/" }
          Compress-Archive -Path "dist/$pkg/*" -DestinationPath "dist/$pkg.zip" -Force
          $hash = (Get-FileHash "dist/$pkg.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $pkg.zip" | Out-File -FilePath "dist/$pkg.zip.sha256" -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-amd64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  build-macos:
    name: Build macos-universal
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF_NAME}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Install Wails CLI & Frontend deps
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          cd frontend && npm ci && cd ..

      - name: Build & Package
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          wails build -clean -trimpath -platform darwin/universal
          VERSION="${{ steps.meta.outputs.version }}"
          PKG="server-desktop-${VERSION}-macos-universal"
          mkdir -p "dist/${PKG}"
          APP_BUNDLE="$(find build/bin -maxdepth 1 -name '*.app' | head -n1)"
          if [ -z "$APP_BUNDLE" ]; then
            echo "No .app bundle found under build/bin"
            ls -la build/bin
            exit 1
          fi
          cp -R "$APP_BUNDLE" "dist/${PKG}/"
          [ -f README.md ] && cp README.md "dist/${PKG}/"
          ditto -c -k --sequesterRsrc --keepParent "dist/${PKG}" "dist/${PKG}.zip"
          (cd dist && shasum -a 256 "${PKG}.zip" > "${PKG}.zip.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-universal
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            VER="${GITHUB_REF_NAME}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec mv {} release/ \;
          ls -lh release/

      - name: Generate release notes
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          cat > release-notes.md << EOF
          ## Xray Panel Desktop ${VERSION}

          ### 跨平台客户端下载

          | 平台 | 文件 | 说明 |
          |------|------|------|
          | Linux (amd64) | \`server-desktop-${VERSION}-linux-amd64.tar.gz\` | Ubuntu 24.04 / WebKit2GTK 4.1 |
          | Windows (amd64) | \`server-desktop-${VERSION}-windows-amd64.zip\` | 解压运行 \`xray-panel-desktop.exe\` |
          | macOS (Universal) | \`server-desktop-${VERSION}-macos-universal.zip\` | 支持 Apple Silicon 与 Intel |

          ### 校验

          \`\`\`bash
          sha256sum -c server-desktop-${VERSION}-linux-amd64.tar.gz.sha256
          \`\`\`
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: Release ${{ steps.meta.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
